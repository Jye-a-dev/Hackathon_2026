[package]
name = "p2p_escrow"
version = "0.1.0"
description = "P2P Second-hand Escrow Program on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p2p_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
